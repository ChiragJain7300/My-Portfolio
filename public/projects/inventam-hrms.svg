<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hrms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151f"/>
      <stop offset="50%" stop-color="#231e2c"/>
      <stop offset="100%" stop-color="#1b1723"/>
    </linearGradient>
    <pattern id="hrms-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#372c47" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#hrms-bg)"/>
  <rect width="800" height="500" fill="url(#hrms-grid)"/>

  <!-- Top Accent Line -->
  <line x1="40" y1="36" x2="760" y2="36" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Header -->
  <rect x="40" y="48" width="720" height="42" rx="8" fill="#2b2337" stroke="#3f3251" stroke-width="1"/>
  <circle cx="62" cy="69" r="5" fill="#ef4444"/>
  <circle cx="78" cy="69" r="5" fill="#f59e0b"/>
  <circle cx="94" cy="69" r="5" fill="#10b981"/>
  <text x="120" y="73" font-family="monospace" font-size="12" fill="#bfa7d4" font-weight="600">SYS_PREVIEW // INVENTAM HRMS (STATUTORY PAYROLL &amp; DESKTOP TELEMETRY)</text>
  <rect x="635" y="58" width="108" height="22" rx="11" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="689" y="73" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle" font-weight="700">● 450+ PAYSLIPS &lt;12s</text>

