  <rect x="300" y="115" width="200" height="135" rx="10" fill="#281f37" stroke="#c084fc" stroke-width="2"/>
  <text x="316" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">FASTAPI ASYNC CORE</text>
  <text x="316" y="162" font-family="monospace" font-size="10" fill="#e9d5ff">Uvicorn + AsyncSQLAlchemy</text>
  <text x="316" y="180" font-family="monospace" font-size="9" fill="#d8b4fe">• WeasyPrint In-Memory ZIP</text>
  <text x="316" y="196" font-family="monospace" font-size="9" fill="#d8b4fe">• 0 MB Server Disk Writes</text>
  <text x="316" y="212" font-family="monospace" font-size="9" fill="#d8b4fe">• LOP &amp; Sandwich Rules</text>
