  <rect x="60" y="115" width="200" height="135" rx="10" fill="#231b30" stroke="#a855f7" stroke-width="1.5"/>
  <text x="76" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">TELEMETRY DAEMON</text>
  <text x="76" y="162" font-family="monospace" font-size="10" fill="#c084fc">Python 3.11 + pynput</text>
  <text x="76" y="180" font-family="monospace" font-size="9" fill="#d8b4fe">• Keystrokes &amp; Mouse Vectors</text>
  <text x="76" y="196" font-family="monospace" font-size="9" fill="#d8b4fe">• Local Disk Encrypted Queue</text>
  <text x="76" y="212" font-family="monospace" font-size="9" fill="#d8b4fe">• 99.9% Outage Delivery</text>
  <rect x="76" y="222" width="168" height="16" rx="4" fill="#a855f7" fill-opacity="0.2"/>
