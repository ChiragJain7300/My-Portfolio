  <!-- Right: Slack Bolt & Frontend -->
  <rect x="540" y="115" width="200" height="135" rx="10" fill="#231b30" stroke="#9333ea" stroke-width="1.5"/>
  <text x="556" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">SLACK BOLT &amp; VITE 6</text>
  <text x="556" y="162" font-family="monospace" font-size="10" fill="#c084fc">React 19 + Slack Engine</text>
  <text x="556" y="180" font-family="monospace" font-size="9" fill="#d8b4fe">• /leaves Slash Modals</text>
  <text x="556" y="196" font-family="monospace" font-size="9" fill="#d8b4fe">• Turnaround: 4.5h &rarr; 10min</text>
