  <text x="640" y="233" font-family="monospace" font-size="8.5" fill="#e9d5ff" text-anchor="middle">APScheduler AUTOMATION</text>

  <!-- Connectors -->
  <line x1="260" y1="180" x2="300" y2="180" stroke="#a855f7" stroke-width="2"/>
  <line x1="500" y1="180" x2="540" y2="180" stroke="#a855f7" stroke-width="2"/>

  <!-- Terminal Output -->
  <rect x="60" y="280" width="680" height="175" rx="10" fill="#181320" stroke="#332545" stroke-width="1"/>
  <rect x="60" y="280" width="680" height="26" rx="10" fill="#221a2d"/>
  <text x="76" y="297" font-family="monospace" font-size="10.5" fill="#9d86b5">TERMINAL // PAYROLL STREAM &amp; TELEMETRY QUEUE LOG</text>

  <text x="76" y="328" font-family="monospace" font-size="10" fill="#c084fc">[00:10:04] WEASYPRINT_STREAM:</text>
  <text x="270" y="328" font-family="monospace" font-size="10" fill="#e2e8f0">Compiled 482 payslips in 11.2s via io.BytesIO. 0 MB disk writes.</text>

  <text x="76" y="348" font-family="monospace" font-size="10" fill="#e9d5ff">[00:10:15] SLACK_BOT (Bolt):</text>
  <text x="270" y="348" font-family="monospace" font-size="10" fill="#e2e8f0">Leave approval dispatched for user #104. Resolved in 6m 40s via 1-click modal.</text>

  <text x="76" y="368" font-family="monospace" font-size="10" fill="#a855f7">[00:10:28] TELEMETRY_INGEST:</text>
  <text x="270" y="368" font-family="monospace" font-size="10" fill="#e2e8f0">Flushed 82 offline telemetry logs from queue_dir after network reconnect.</text>

  <text x="76" y="388" font-family="monospace" font-size="10" fill="#c084fc">[00:10:45] ASYNC_DB (Asyncpg):</text>
  <text x="270" y="388" font-family="monospace" font-size="10" fill="#e2e8f0">Calculated sandwich rule LOP deductions across 482 records in 84ms.</text>

  <rect x="76" y="410" width="220" height="26" rx="6" fill="#291c3c" stroke="#4a2c70" stroke-width="1"/>
  <text x="186" y="427" font-family="monospace" font-size="9.5" fill="#e9d5ff" text-anchor="middle" font-weight="700">✓ ENTERPRISE HR &amp; PAYROLL ACTIVE</text>
</svg>
