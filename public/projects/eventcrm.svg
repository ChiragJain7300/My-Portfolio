  <text x="556" y="162" font-family="monospace" font-size="10" fill="#f472b6">Redux Toolkit + TanStack</text>
  <text x="556" y="180" font-family="monospace" font-size="9" fill="#fbcfe8">• Three-Tier Layered Fetch</text>
  <text x="556" y="196" font-family="monospace" font-size="9" fill="#fbcfe8">• Automated WhatsApp Alerts</text>
  <text x="556" y="212" font-family="monospace" font-size="9" fill="#fbcfe8">• AWS S3 Pre-Signed Assets</text>
