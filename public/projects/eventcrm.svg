  <rect x="60" y="280" width="680" height="175" rx="10" fill="#181116" stroke="#381e30" stroke-width="1"/>
  <rect x="60" y="280" width="680" height="26" rx="10" fill="#22151f"/>
  <text x="76" y="297" font-family="monospace" font-size="10.5" fill="#9c738e">TERMINAL // ATOMIC EVENT ONBOARDING &amp; EDGE RBAC GUARD TRACE</text>

  <text x="76" y="328" font-family="monospace" font-size="10" fill="#f472b6">[15:30:11] EDGE_MIDDLEWARE:</text>
  <text x="270" y="328" font-family="monospace" font-size="10" fill="#e2e8f0">Route /events/create accessed. Verified role 'EVENT_PLANNER'. Access granted in 8ms.</text>

  <text x="76" y="348" font-family="monospace" font-size="10" fill="#fbcfe8">[15:32:20] WIZARD_SUBMIT:</text>
  <text x="270" y="348" font-family="monospace" font-size="10" fill="#e2e8f0">Validated customer + event + dietary matrix payload. Created event in 2m 14s.</text>

  <text x="76" y="368" font-family="monospace" font-size="10" fill="#fce7f3">[15:32:21] ISOMORPHIC_AXIOS:</text>
  <text x="270" y="368" font-family="monospace" font-size="10" fill="#e2e8f0">Injected Bearer session token across Server Component. Cache-Control: no-store enforced.</text>

  <text x="76" y="388" font-family="monospace" font-size="10" fill="#f472b6">[15:34:00] WHATSAPP_DISPATCH:</text>
  <text x="270" y="388" font-family="monospace" font-size="10" fill="#e2e8f0">Culinary chef schedule notification dispatched. Confirmed delivery to kitchen team.</text>

  <rect x="76" y="410" width="220" height="26" rx="6" fill="#2c1626" stroke="#4d2442" stroke-width="1"/>
  <text x="186" y="427" font-family="monospace" font-size="9.5" fill="#fbcfe8" text-anchor="middle" font-weight="700">✓ ENTERPRISE EVENT CRM ACTIVE</text>
</svg>
