  <rect x="635" y="58" width="108" height="22" rx="11" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="689" y="73" font-family="monospace" font-size="10" fill="#f472b6" text-anchor="middle" font-weight="700">● 12m &rarr; &lt;2.5m ONBOARD</text>

