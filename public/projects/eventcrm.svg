      <stop offset="0%" stop-color="#191316"/>
      <stop offset="50%" stop-color="#241a20"/>
      <stop offset="100%" stop-color="#1c1419"/>
    </linearGradient>
    <pattern id="event-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3d2936" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#event-bg)"/>
  <rect width="800" height="500" fill="url(#event-grid)"/>

  <!-- Top Accent Line -->
