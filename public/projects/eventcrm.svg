  <rect x="60" y="115" width="200" height="135" rx="10" fill="#22151f" stroke="#ec4899" stroke-width="1.5"/>
  <text x="76" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">ONBOARDING WIZARD</text>
  <text x="76" y="162" font-family="monospace" font-size="10" fill="#f472b6">Next.js App Router + Yup</text>
  <text x="76" y="180" font-family="monospace" font-size="9" fill="#fbcfe8">• Onboard: 12m &rarr; &lt;2.5m</text>
  <text x="76" y="196" font-family="monospace" font-size="9" fill="#fbcfe8">• Customer + Event Payload</text>
  <text x="76" y="212" font-family="monospace" font-size="9" fill="#fbcfe8">• Menu &amp; Dietary Matrix</text>
  <rect x="76" y="222" width="168" height="16" rx="4" fill="#ec4899" fill-opacity="0.2"/>
