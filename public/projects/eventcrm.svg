  <rect x="300" y="115" width="200" height="135" rx="10" fill="#2a1725" stroke="#f472b6" stroke-width="2"/>
  <text x="316" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">EDGE RBAC &amp; AUTH</text>
  <text x="316" y="162" font-family="monospace" font-size="10" fill="#cbe3b3">Next.js Edge Middleware</text>
  <text x="316" y="180" font-family="monospace" font-size="9" fill="#fbcfe8">• 100% Unauthorized Gating</text>
  <text x="316" y="196" font-family="monospace" font-size="9" fill="#fbcfe8">• Isomorphic Axios Resolver</text>
  <text x="316" y="212" font-family="monospace" font-size="9" fill="#fbcfe8">• &lt;HasAccess&gt; UI Guards</text>
  <rect x="316" y="222" width="168" height="16" rx="4" fill="#db2777" fill-opacity="0.3"/>
  <text x="400" y="233" font-family="monospace" font-size="8.5" fill="#fce7f3" text-anchor="middle">Cache-Control: no-store</text>

