  <line x1="260" y1="180" x2="300" y2="180" stroke="#10b981" stroke-width="2"/>
  <line x1="500" y1="180" x2="540" y2="180" stroke="#10b981" stroke-width="2"/>

  <!-- Terminal Output -->
  <rect x="60" y="280" width="680" height="175" rx="10" fill="#141a17" stroke="#25352d" stroke-width="1"/>
  <rect x="60" y="280" width="680" height="26" rx="10" fill="#1b2420"/>
  <text x="76" y="297" font-family="monospace" font-size="10.5" fill="#789689">TERMINAL // DECOUPLED LEAD DISPATCH &amp; REORDERING TELEMETRY</text>

  <text x="76" y="328" font-family="monospace" font-size="10" fill="#34d399">[14:22:04] POST /enquire:</text>
  <text x="260" y="328" font-family="monospace" font-size="10" fill="#e2e8f0">Lead committed to PostgreSQL (ID: e9a2-411). Return 201 Created</text>

  <text x="76" y="348" font-family="monospace" font-size="10" fill="#a7f3d0">[14:22:04] ASYNC_TASK (CRM):</text>
  <text x="260" y="348" font-family="monospace" font-size="10" fill="#e2e8f0">Dispatched payload to Buildesk CRM. Response 200 in 118ms</text>

  <text x="76" y="368" font-family="monospace" font-size="10" fill="#6ee7b7">[14:25:12] PUT /admin/sequence:</text>
  <text x="260" y="368" font-family="monospace" font-size="10" fill="#e2e8f0">Batched array [12 projects] updated in 1 transaction (90% write reduction)</text>

  <text x="76" y="388" font-family="monospace" font-size="10" fill="#34d399">[14:28:40] AUTH_MUTEX (Axios):</text>
  <text x="260" y="388" font-family="monospace" font-size="10" fill="#e2e8f0">Access token refreshed. Drained 4 queued subscribers with zero logout</text>

  <rect x="76" y="410" width="220" height="26" rx="6" fill="#1f2c25" stroke="#2d4237" stroke-width="1"/>
  <text x="186" y="427" font-family="monospace" font-size="9.5" fill="#a7f3d0" text-anchor="middle" font-weight="700">✓ DUAL-PLATFORM ARCHITECTURE ACTIVE</text>
</svg>
