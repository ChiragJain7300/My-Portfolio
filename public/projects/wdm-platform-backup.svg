<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181a"/>
      <stop offset="50%" stop-color="#1c2225"/>
      <stop offset="100%" stop-color="#161b1e"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2a3439" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Glowing Accent Line Top -->
  <line x1="40" y1="36" x2="760" y2="36" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Header Bar -->
  <rect x="40" y="48" width="720" height="42" rx="8" fill="#232a2e" stroke="#323c42" stroke-width="1"/>
  <circle cx="62" cy="69" r="5" fill="#ef4444"/>
  <circle cx="78" cy="69" r="5" fill="#f59e0b"/>
  <circle cx="94" cy="69" r="5" fill="#10b981"/>
  <text x="120" y="73" font-family="monospace" font-size="12" fill="#8da399" font-weight="600">SYS_PREVIEW // WDM PLATFORM (RETAILER INTEGRATION &amp; LOGISTICS ENGINE)</text>
  <rect x="640" y="58" width="104" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="692" y="73" font-family="monospace" font-size="10" fill="#22d3ee" text-anchor="middle" font-weight="700">● 98% OAUTH REDUCTION</text>

  <!-- Node 1: Bol.com Retailer API -->
  <rect x="60" y="125" width="180" height="110" rx="10" fill="#1f262a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="76" y="152" font-family="sans-serif" font-size="11" font-weight="700" fill="#06b6d4">BOL.COM API v10</text>
  <text x="76" y="172" font-family="monospace" font-size="10" fill="#a8c2b5">Async CSV Export</text>
  <text x="76" y="190" font-family="monospace" font-size="9" fill="#758a7e">Polling Interval: 250ms</text>
  <rect x="76" y="202" width="70" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="111" y="214" font-family="monospace" font-size="8.5" fill="#67e8f9" text-anchor="middle">RETAILER API</text>

  <!-- Arrow 1 to 2 -->
  <line x1="240" y1="180" x2="310" y2="180" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="310,176 318,180 310,184" fill="#06b6d4"/>

  <!-- Node 2: Core Ingestion Service -->
  <rect x="318" y="115" width="200" height="135" rx="12" fill="#232a2e" stroke="#22d3ee" stroke-width="2"/>
  <text x="334" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">WDM INGESTION CORE</text>
  <text x="334" y="162" font-family="monospace" font-size="10" fill="#cbe3b3">Express 5 + Node.js ESM</text>
  <text x="334" y="180" font-family="monospace" font-size="9.5" fill="#a8c2b5">• Set-Difference Reconciler</text>
  <text x="334" y="196" font-family="monospace" font-size="9.5" fill="#a8c2b5">• DB-Cached OAuth Mutex</text>
  <text x="334" y="212" font-family="monospace" font-size="9.5" fill="#a8c2b5">• Self-Healing CronLog</text>
  <rect x="334" y="222" width="168" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="418" y="233" font-family="monospace" font-size="8.5" fill="#34d399" text-anchor="middle">100% CATALOG CONSISTENCY</text>

  <!-- Arrow 2 to 3 -->
  <line x1="518" y1="180" x2="580" y2="180" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="580,176 588,180 580,184" fill="#06b6d4"/>

  <!-- Node 3: Monday.com & WMS -->
  <rect x="588" y="125" width="152" height="110" rx="10" fill="#1f262a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="604" y="152" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">MONDAY.COM &amp; WMS</text>
  <text x="604" y="172" font-family="monospace" font-size="10" fill="#a8c2b5">GraphQL Mutations</text>
  <text x="604" y="190" font-family="monospace" font-size="9" fill="#758a7e">Live Inventory Sync</text>
  <rect x="604" y="202" width="86" height="18" rx="4" fill="#818cf8" fill-opacity="0.2"/>
  <text x="647" y="214" font-family="monospace" font-size="8.5" fill="#a5b4fc" text-anchor="middle">GRAPHQL SYNC</text>

  <!-- Lower Terminal Card -->
  <rect x="60" y="280" width="680" height="175" rx="10" fill="#15191b" stroke="#2b363c" stroke-width="1"/>
  <rect x="60" y="280" width="680" height="26" rx="10" fill="#1c2225"/>
  <text x="76" y="297" font-family="monospace" font-size="10.5" fill="#758a7e">TERMINAL // CRONLOG EXECUTION AUDIT TRACE</text>
  
  <text x="76" y="328" font-family="monospace" font-size="10" fill="#86efac">[04:00:02 CET] INFO (TokenCache):</text>
  <text x="310" y="328" font-family="monospace" font-size="10" fill="#e2e8f0">Reusing active OAuth Bearer token (Expires in 284s - Buffer active)</text>

  <text x="76" y="348" font-family="monospace" font-size="10" fill="#38bdf8">[04:00:15 CET] PIPELINE (CatalogSync):</text>
  <text x="310" y="348" font-family="monospace" font-size="10" fill="#e2e8f0">Parsed 14,280 products via streaming csvtojson pipe. Memory: 42 MB RAM</text>

  <text x="76" y="368" font-family="monospace" font-size="10" fill="#fbbf24">[04:00:22 CET] RECONCILER (SetDiff):</text>
  <text x="310" y="368" font-family="monospace" font-size="10" fill="#e2e8f0">Detected 38 delisted EANs (Stored \ Incoming). Purging orphans from MongoDB</text>

  <text x="76" y="388" font-family="monospace" font-size="10" fill="#a78bfa">[07:00:00 CET] RECOVERY (CronRunner):</text>
  <text x="310" y="388" font-family="monospace" font-size="10" fill="#e2e8f0">CronLog check: 0 failed tasks detected. Ingestion verified 100% healthy.</text>

  <rect x="76" y="410" width="200" height="26" rx="6" fill="#232a2e" stroke="#37434a" stroke-width="1"/>
  <text x="176" y="427" font-family="monospace" font-size="9.5" fill="#cbe3b3" text-anchor="middle" font-weight="700">✓ AUTOMATION ACTIVE · PM2 SUPERVISED</text>
</svg>
